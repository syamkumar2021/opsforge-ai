services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: opsforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opsforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsforge_secret}
      POSTGRES_DB: ${POSTGRES_DB:-opsforge}
    ports:
      - "5432:5432"
    volumes:
      - opsforge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-opsforge} -d ${POSTGRES_DB:-opsforge}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - opsforge-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: opsforge-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_KRAFT_CLUSTER_ID: xOE0K3qWTKCwUNsHkNYBTA
      CLUSTER_ID: xOE0K3qWTKCwUNsHkNYBTA
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - opsforge_kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server localhost:29092 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - opsforge-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: opsforge-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - opsforge-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opsforge-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-opsforge}:${POSTGRES_PASSWORD:-opsforge_secret}@postgres:5432/${POSTGRES_DB:-opsforge}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DOCKER_ENV: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: opsforge@local.test
      NOTIFY_EMAIL_TO: ops-team@company.com
      SMTP_TLS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./reports:/app/reports
    networks:
      - opsforge-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    container_name: opsforge-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - app
    networks:
      - opsforge-net

volumes:
  opsforge_postgres_data:
    name: opsforge_postgres_data
  opsforge_kafka_data:
    name: opsforge_kafka_data

networks:
  opsforge-net:
    name: opsforge-net
    driver: bridge